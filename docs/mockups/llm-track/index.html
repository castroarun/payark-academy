<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockups — Build an LLM track (A / B / C, light + dark)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ───────────────── Design tokens (one place for colour, type, radius) ───────────────── */
:root, [data-theme="light"] {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --surface-2: #f6f7f9;
  --border: #e2e5ea;
  --text: #14171c;
  --muted: #565d6b;          /* 6.6:1 on white */
  --faint: #6b7280;          /* 4.8:1 on white */
  --accent: #0f7a55;         /* 5.3:1 with white text */
  --accent-text: #ffffff;
  --accent-soft: #e5f3ed;
  --accent-ink: #0b5e41;     /* accent used as text on light surfaces */
  --track: #e6e9ee;
  --warn-soft: #fdf3e3;
  --warn-ink: #8a5300;
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
}
[data-theme="dark"] {
  --bg: #0d0f12;
  --surface: #15181d;
  --surface-2: #1b1f25;
  --border: #2a2f37;
  --text: #eceef2;
  --muted: #a7adb8;          /* 8:1 on surface */
  --faint: #8d94a0;          /* 5.6:1 on surface */
  --accent: #3fcf8e;
  --accent-text: #05281a;
  --accent-soft: #15302a;
  --accent-ink: #5fdca3;
  --track: #262b33;
  --warn-soft: #2e2416;
  --warn-ink: #f0b860;
  --shadow: none;
}
/* Accent options (green is the default in the tokens above) */
[data-accent="indigo"][data-theme="light"] { --accent:#4338ca; --accent-text:#ffffff; --accent-soft:#ecebfc; --accent-ink:#3730a3; }
[data-accent="indigo"][data-theme="dark"] { --accent:#a5a6ff; --accent-text:#14124a; --accent-soft:#22224a; --accent-ink:#b8b9ff; }
[data-accent="ocean"][data-theme="light"] { --accent:#1d5fd1; --accent-text:#ffffff; --accent-soft:#e6eefb; --accent-ink:#174ea9; }
[data-accent="ocean"][data-theme="dark"] { --accent:#6ea8ff; --accent-text:#04203f; --accent-soft:#162a45; --accent-ink:#8fbcff; }
[data-accent="plum"][data-theme="light"] { --accent:#7c3aad; --accent-text:#ffffff; --accent-soft:#f3eaf9; --accent-ink:#64308c; }
[data-accent="plum"][data-theme="dark"] { --accent:#c9a0ee; --accent-text:#2a0f45; --accent-soft:#2c1f3b; --accent-ink:#d4b3f2; }
[data-accent="terracotta"][data-theme="light"] { --accent:#b0502a; --accent-text:#ffffff; --accent-soft:#f8ebe4; --accent-ink:#8f3f1f; }
[data-accent="terracotta"][data-theme="dark"] { --accent:#f0956a; --accent-text:#3a1606; --accent-soft:#3a2419; --accent-ink:#f5ac88; }
[data-accent="graphite"][data-theme="light"] { --accent:#1f2937; --accent-text:#ffffff; --accent-soft:#eceef2; --accent-ink:#1f2937; }
[data-accent="graphite"][data-theme="dark"] { --accent:#e5e7eb; --accent-text:#111827; --accent-soft:#262b33; --accent-ink:#e5e7eb; }
[data-accent="navy"][data-theme="light"] { --accent:#1e3a8a; --accent-text:#ffffff; --accent-soft:#e8edf8; --accent-ink:#1e3a8a; }
[data-accent="navy"][data-theme="dark"] { --accent:#93b4f5; --accent-text:#0b1a3d; --accent-soft:#1a2a4d; --accent-ink:#a9c3f7; }
[data-accent="midnight"][data-theme="light"] { --accent:#172554; --accent-text:#ffffff; --accent-soft:#e7eaf3; --accent-ink:#172554; }
[data-accent="midnight"][data-theme="dark"] { --accent:#a3b8e8; --accent-text:#0a1430; --accent-soft:#1d2a4a; --accent-ink:#b8c8ee; }
[data-accent="sapphire"][data-theme="light"] { --accent:#1d4ed8; --accent-text:#ffffff; --accent-soft:#e6edfc; --accent-ink:#1e40af; }
[data-accent="sapphire"][data-theme="dark"] { --accent:#7aa2ff; --accent-text:#071a45; --accent-soft:#172747; --accent-ink:#9ab8ff; }
[data-accent="teal"][data-theme="light"] { --accent:#0f766e; --accent-text:#ffffff; --accent-soft:#e3f3f1; --accent-ink:#0d5f59; }
[data-accent="teal"][data-theme="dark"] { --accent:#4fd1c5; --accent-text:#042f2b; --accent-soft:#13302e; --accent-ink:#6fdcd2; }
[data-accent="rose"][data-theme="light"] { --accent:#be185d; --accent-text:#ffffff; --accent-soft:#fbe8f0; --accent-ink:#9d174d; }
[data-accent="rose"][data-theme="dark"] { --accent:#f58bb4; --accent-text:#3f0a22; --accent-soft:#3a1a28; --accent-ink:#f7a5c5; }
[data-accent="amber"][data-theme="light"] { --accent:#92400e; --accent-text:#ffffff; --accent-soft:#fbefe2; --accent-ink:#92400e; }
[data-accent="amber"][data-theme="dark"] { --accent:#f5b454; --accent-text:#3a2203; --accent-soft:#33261a; --accent-ink:#f7c475; }
[data-accent="navy"][data-theme="dark"], [data-accent="midnight"][data-theme="dark"] {
  --bg:#0a1222; --surface:#101b31; --surface-2:#16233d; --border:#24345a; --track:#1f2d4d; --muted:#aab6cc; --faint:#8f9cb5; }
[data-accent="navy"][data-theme="light"], [data-accent="midnight"][data-theme="light"] { --bg:#eef1f7; --border:#dde3ee; --track:#e1e6f0; }
:root {
  --radius: 14px;
  --radius-sm: 10px;
  --font: "Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); }
a { color: var(--accent-ink); }
button { font: inherit; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
.mono { font-family: var(--mono); font-size: 12px; }

/* ───────────────── Mockup chrome (not part of the design) ───────────────── */
.chrome {
  position: sticky; top: 0; z-index: 20;
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
  padding: 10px 16px; background: #1f2329; color: #f1f3f5; font-size: 13px;
}
.chrome strong { margin-right: 8px; }
.seg { display: inline-flex; border: 1px solid #3a4049; border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; border: 0; color: #d5d9de; padding: 6px 12px; cursor: pointer; min-height: 32px; }
.seg button[aria-pressed="true"] { background: #f1f3f5; color: #1f2329; font-weight: 600; }
.swatches { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.swatches button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #3a4049; background: transparent; color: #d5d9de; border-radius: 999px; padding: 4px 10px 4px 5px; cursor: pointer; min-height: 32px; font-size: 12px; }
.swatches button i { width: 20px; height: 20px; border-radius: 50%; display: inline-block; border: 2px solid rgba(255,255,255,.25); }
.swatches button[aria-pressed="true"] { background: #f1f3f5; color: #1f2329; font-weight: 600; }
.chrome .hint { color: #b5bbc4; margin-left: auto; }
.chrome .reset { background: transparent; border: 1px solid #3a4049; color: #d5d9de; border-radius: 8px; padding: 6px 12px; cursor: pointer; }

/* ───────────────── Shared components ───────────────── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.pad { padding: 20px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 10px 18px; min-height: 44px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--text); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.small { min-height: 36px; padding: 6px 14px; font-size: 13px; }
.btn.link { border: 0; background: none; padding: 0; min-height: 0; color: var(--accent-ink); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 500; }
.pill.ok { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }
.pill.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn-ink); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }
.bar { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }
.bar.thin { height: 6px; }
.segbar { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
.segbar span { height: 8px; border-radius: 4px; background: var(--track); }
.segbar span.done { background: var(--accent); }
.segbar span.part { background: linear-gradient(90deg, var(--accent) var(--p), var(--track) var(--p)); }
.icon { width: 18px; height: 18px; flex: none; }
.row { display: flex; align-items: center; gap: 12px; }
.stack { display: flex; flex-direction: column; }
.gap4 { gap: 4px; } .gap8 { gap: 8px; } .gap12 { gap: 12px; } .gap16 { gap: 16px; } .gap24 { gap: 24px; }
.grow { flex: 1; min-width: 0; }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--border); }
.tabs button { background: none; border: 0; padding: 10px 0; cursor: pointer; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; min-height: 44px; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }
.search { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 0 16px; min-height: 44px; }
.search input { border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; flex: 1; }
.check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); display: inline-flex; align-items: center; justify-content: center; flex: none; background: var(--surface); }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.check.part { border-color: var(--accent); }
.num { width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 13px; font-weight: 500; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); flex: none; }
.num.done { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
.num.current { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.thumb { position: relative; aspect-ratio: 16/9; border-radius: var(--radius-sm); overflow: hidden; background: #000; }
.thumb img { width: 100%; height: 100%; object-fit: cover; opacity: .85; display: block; }
.thumb .play { position: absolute; inset: 0; margin: auto; width: 64px; height: 64px; border-radius: 50%; border: 0; background: rgba(0,0,0,.65); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.thumb .watched { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.25); }
.thumb .watched span { display: block; height: 100%; background: #ff3b30; }
.step { display: flex; gap: 14px; padding: 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
.step.done { background: var(--surface-2); }
.step .title { font-weight: 600; }
.step.done .title { color: var(--muted); }
details.extras summary { cursor: pointer; font-weight: 600; padding: 4px 0; min-height: 32px; }
.ring { --p: 0; width: 120px; height: 120px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--track) 0); display: grid; place-items: center; }
.ring > div { width: 96px; height: 96px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; text-align: center; }
.ring b { font-size: 24px; display: block; line-height: 1.1; }
.howto li { margin: 0 0 10px; }
.howto { padding-left: 20px; margin: 0; color: var(--muted); font-size: 14px; }
.howto b { color: var(--text); }
.crumb { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--faint); flex-wrap: wrap; }
.crumb button { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.locked-note { color: var(--warn-ink); font-size: 13px; }
.sample { font-size: 12px; color: var(--faint); font-style: italic; }

/* ───────────────── Variant A — Workspace (sidebar + content + progress rail) ───────────────── */
.a-shell { display: grid; grid-template-columns: 240px minmax(0, 1fr) 300px; gap: 24px; max-width: 1360px; margin: 0 auto; padding: 24px; align-items: start; }
.a-side { position: sticky; top: 76px; padding: 8px; }
.a-brand { font-weight: 700; font-size: 18px; padding: 8px 12px 16px; }
.a-nav { display: flex; flex-direction: column; gap: 2px; }
.a-nav button { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; border: 0; background: none; cursor: pointer; text-align: left; color: var(--text); min-height: 44px; }
.a-nav button[aria-current="page"] { background: var(--border); font-weight: 600; }
.a-nav button:hover { background: var(--surface-2); }
.a-main { display: flex; flex-direction: column; gap: 20px; }
.a-hero { background: var(--accent); color: var(--accent-text); border-radius: var(--radius); padding: 28px; display: flex; flex-direction: column; gap: 14px; }
.a-hero .bar { background: rgba(255,255,255,.28); }
[data-theme="dark"] .a-hero .bar { background: rgba(0,0,0,.22); }
.a-hero .bar > span { background: var(--accent-text); }
.a-hero .btn { border-color: transparent; background: var(--accent-text); color: var(--accent); }
[data-theme="dark"] .a-hero .btn { color: var(--accent); }
.a-hero .btn.ghost { background: transparent; border: 1px solid currentColor; color: var(--accent-text); }
.a-mod { display: flex; gap: 16px; padding: 18px 20px; align-items: flex-start; cursor: pointer; text-align: left; width: 100%; }
.a-mod:hover { border-color: var(--faint); }
.a-rail { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 76px; }

/* ───────────────── Variant B — Path (one column, vertical journey) ───────────────── */
.b-top { position: sticky; top: 52px; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border); }
.b-top-in { max-width: 820px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 20px; }
.b-col { max-width: 820px; margin: 0 auto; padding: 32px 24px 80px; display: flex; flex-direction: column; gap: 28px; }
.b-phase { display: flex; flex-direction: column; gap: 0; }
.b-node { display: grid; grid-template-columns: 48px minmax(0,1fr); gap: 16px; }
.b-rail { display: flex; flex-direction: column; align-items: center; }
.b-rail .line { width: 2px; flex: 1; background: var(--border); min-height: 16px; }
.b-rail .line.done { background: var(--accent); }
.b-dot { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--border); background: var(--surface); font-family: var(--mono); font-size: 12px; color: var(--muted); }
.b-dot.done { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.b-dot.current { border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 4px var(--accent-soft); }
.b-body { padding: 6px 0 24px; }
.b-card { margin-top: 12px; }
.b-head { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; width: 100%; }

/* ───────────────── Variant C — Player (syllabus rail + lesson) ───────────────── */
.c-top { background: var(--surface); border-bottom: 1px solid var(--border); }
.c-top-in { max-width: 1360px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.c-shell { display: grid; grid-template-columns: 320px minmax(0,1fr); max-width: 1360px; margin: 0 auto; min-height: calc(100vh - 120px); }
.c-syl { border-right: 1px solid var(--border); background: var(--surface); padding: 16px 12px; overflow: auto; }
.c-syl-mod { border: 0; background: none; width: 100%; text-align: left; display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 10px; cursor: pointer; min-height: 48px; }
.c-syl-mod:hover { background: var(--surface-2); }
.c-syl-mod[aria-current="true"] { background: var(--accent-soft); }
.c-syl-steps { list-style: none; margin: 0 0 8px 0; padding: 0 0 0 48px; display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.c-syl-steps li { display: flex; align-items: center; gap: 8px; padding: 6px 0; color: var(--muted); }
.c-main { padding: 28px 32px 80px; display: flex; flex-direction: column; gap: 20px; max-width: 980px; }
.c-phase-label { padding: 14px 10px 6px; }

/* ───────────────── Phone widths ───────────────── */
@media (max-width: 1100px) {
  .a-shell { grid-template-columns: 1fr; }
  .a-side, .a-rail { position: static; }
  .a-nav { flex-direction: row; flex-wrap: wrap; }
  .c-shell { grid-template-columns: 1fr; }
  .c-syl { border-right: 0; border-bottom: 1px solid var(--border); max-height: 320px; }
}
@media (max-width: 640px) {
  .a-shell, .b-col { padding: 16px; }
  .c-main { padding: 20px 16px 60px; }
  .chrome .hint { display: none; }
}
</style>
</head>
<body>

<div class="chrome" role="region" aria-label="Mockup controls">
  <strong>Mockup</strong>
  <span class="seg" id="variantSeg">
    <button type="button" data-v="A">A · Workspace</button>
    <button type="button" data-v="B">B · Path</button>
    <button type="button" data-v="C">C · Player</button>
  </span>
  <span class="seg" id="themeSeg">
    <button type="button" data-t="light">Light</button>
    <button type="button" data-t="dark">Dark</button>
  </span>
  <span class="swatches" id="accentSeg" role="group" aria-label="Accent colour"></span>
  <button type="button" class="reset" id="resetBtn">Reset demo progress</button>
  <span class="hint">Click modules and tick steps — progress updates everywhere. Demo progress is sample data.</span>
</div>

<div id="app"></div>

<script>

// ───────────────── Progress logic ─────────────────
const stepDone = (m, i) => !!S.p.done[m+"-"+i];
const modDoneCount = m => MODULES[m].steps.filter((_, i) => stepDone(m, i)).length;
const modDone = m => modDoneCount(m) === MODULES[m].steps.length;
function modPct(m) {
  const mod = MODULES[m]; let sum = 0;
  mod.steps.forEach((s, i) => { if (stepDone(m, i)) sum += 1; else if (s.min && S.p.watched[m+"-"+i]) sum += S.p.watched[m+"-"+i] / s.min; });
  return Math.round(sum / mod.steps.length * 100);
}
function status(m) {
  if (modDone(m)) return "done";
  if (!MODULES[m].pre.every(modDone)) return "locked";
  return modPct(m) > 0 ? "progress" : "ready";
}
const overallPct = () => Math.round(MODULES.reduce((a, m) => a + modPct(m.id), 0) / MODULES.length);
const modulesDone = () => MODULES.filter(m => modDone(m.id)).length;
const current = () => MODULES.find(m => status(m.id) === "progress") || MODULES.find(m => status(m.id) === "ready");
const nextStepIdx = m => MODULES[m].steps.findIndex((_, i) => !stepDone(m, i));
const canTick = (m, i) => MODULES[m].steps[i].k !== "check" || MODULES[m].steps.every((s, j) => j === i || stepDone(m, j));
function fmtMin(min) { const h = Math.floor(min / 60), mm = min % 60; return h ? h + ":" + String(mm).padStart(2, "0") + ":00" : mm + ":00"; }
function fmtSec(sec) { const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), x = sec % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); }
function fmtLen(min) { return min < 60 ? min + " min" : (min / 60).toFixed(min % 60 ? 1 : 0) + " h"; }

// ───────────────── Shared pieces ─────────────────
function statusPill(m) {

  if (s === "progress") return `<span class="pill ok">In progress · ${modPct(m)}%</span>`;

  return `<span class="pill">${ico("lock")} Locked</span>`;
}
function lockedReason(m) {

}
function videoBlock(m, i, s) {
  const w = S.p.watched[m+"-"+i] || 0, pct = stepDone(m, i) ? 100 : Math.round(w / s.min * 100);

      <button type="button" class="btn primary" data-act="open" data-m="${cur.id}">${modPct(cur.id) ? "Continue" : "Start"} ${ico("arrow")}</button></div>` : ""}
    <details class="card pad"><summary style="cursor:pointer;font-weight:600;min-height:32px">How this works</summary><div style="margin-top:12px">${howItWorks}</div></details>
    ${PHASES.map(ph => `<section class="b-phase" aria-label="${ph}"><h2 class="label" style="margin:0 0 12px 64px">${ph}</h2>
      ${MODULES.filter(m => m.phase === ph).map(m => { const s = status(m.id), isCur = cur && cur.id === m.id;
        return `<div class="b-node"><div class="b-rail"><span class="b-dot ${s === "done" ? "done" : isCur ? "current" : ""}">${s === "done" ? ico("check") : s === "locked" ? ico("lock") : String(m.id).padStart(2,"0")}</span><span class="line ${s === "done" ? "done" : ""}"></span></div>
          <div class="b-body"><button type="button" class="b-head" data-act="open" data-m="${m.id}">
            <span class="row" style="flex-wrap:wrap;gap:8px"><span style="font-weight:600;font-size:17px;color:${s === "locked" ? "var(--muted)" : "var(--text)"}">${m.title}</span>${statusPill(m.id)}</span>
            <span class="faint" style="font-size:14px;display:block;margin-top:2px">${m.dur} · ${m.steps.length} steps${s === "locked" ? " · " + lockedReason(m.id) : ""}</span></button>
            ${isCur ? `<div class="card pad b-card stack gap12"><p class="muted" style="font-size:14px">${m.goal}</p>${m.steps.map((st, i) => `<div class="row" style="gap:10px"><span class="check ${stepDone(m.id,i) ? "on" : ""}" aria-hidden="true">${stepDone(m.id,i) ? ico("check") : ""}</span><span class="grow" style="font-size:14px;${stepDone(m.id,i) ? "color:var(--muted);text-decoration:line-through" : ""}"><b>${KIND[st.k]}:</b> ${st.t}</span></div>`).join("")}
              <div><button type="button" class="btn primary small" data-act="open" data-m="${m.id}">Open module ${ico("arrow")}</button></div></div>` : ""}
          </div></div>`; }).join("")}</section>`).join("")}
  </div>`;
}

// ───────────────── Variant C — Player ─────────────────
function renderC() {
  const m = MODULES[S.view === "module" ? S.mod : (current() || MODULES[0]).id];
  const top = `<div class="c-top"><div class="c-top-in">
    <span style="font-weight:700;font-size:17px">Build an LLM from Scratch</span>
    <div class="grow" style="min-width:220px"><div class="segbar" role="img" aria-label="${modulesDone()} of 12 modules complete">${MODULES.map(x => { const s = status(x.id); return `<span class="${s === "done" ? "done" : s === "progress" ? "part" : ""}" style="--p:${modPct(x.id)}%"></span>`; }).join("")}</div></div>
    <span class="muted" style="font-size:14px"><b style="color:var(--text)">${modulesDone()} of 12</b> modules · ${overallPct()}% of the path</span></div></div>`;
  const syl = `<nav class="c-syl" aria-label="Syllabus">${PHASES.map(ph => `<div class="label c-phase-label">${ph}</div>${MODULES.filter(x => x.phase === ph).map(x => { const s = status(x.id), here = x.id === m.id;
    return `<button type="button" class="c-syl-mod" data-act="open" data-m="${x.id}" aria-current="${here}">
      <span class="num ${s === "done" ? "done" : here ? "current" : ""}" style="width:32px;height:32px;border-radius:9px">${s === "done" ? ico("check") : String(x.id).padStart(2,"0")}</span>
      <span class="grow stack"><span style="font-weight:${here ? 600 : 500};font-size:14px;color:${s === "locked" ? "var(--muted)" : "var(--text)"}">${x.title}</span><span class="faint" style="font-size:12px">${s === "done" ? "Completed" : s === "locked" ? "Locked" : modPct(x.id) + "% · " + x.dur}</span></span>
      ${s === "locked" ? ico("lock") : ""}</button>
      ${here ? `<ul class="c-syl-steps">${x.steps.map((st, i) => `<li><span class="check ${stepDone(x.id,i) ? "on" : ""}" style="width:18px;height:18px" aria-hidden="true">${stepDone(x.id,i) ? ico("check","icon") : ""}</span>${KIND[st.k]}</li>`).join("")}</ul>` : ""}`; }).join("")}`).join("")}</nav>`;
  const ni = nextStepIdx(m.id), vi = m.steps.findIndex((s, i) => s.yt && !stepDone(m.id, i));
  const tabs = [["lesson","Lesson"],["steps","All steps"],["about","About this module"]];
  let body;
  if (S.cTab === "lesson") {
    body = vi >= 0 ? `<div class="stack gap12">${videoBlock(m.id, vi, m.steps[vi])}
        <div class="row" style="flex-wrap:wrap"><div class="grow"><span class="label">Watch</span><p style="font-weight:600;font-size:18px">${m.steps[vi].t}</p><p class="faint" style="font-size:14px">${m.steps[vi].by} · ${fmtLen(m.steps[vi].min)}${m.steps[vi].part ? " · " + m.steps[vi].part : ""}</p></div>
        <button type="button" class="btn" data-act="tick" data-m="${m.id}" data-i="${vi}">Mark watched</button></div>
        ${m.steps[vi].chapters ? `<div class="card pad"><span class="label">In this part</span><ol style="margin:8px 0 0;padding-left:18px;font-size:14px" class="muted">${m.steps[vi].chapters.map(c => `<li><span class="mono">${c[0]}</span> ${c[1]}</li>`).join("")}</ol></div>` : ""}</div>`
      : ni >= 0 ? `<div class="card pad stack gap12"><span class="label">Next step · ${KIND[m.steps[ni].k]}</span><p style="font-weight:600;font-size:18px">${m.steps[ni].t}</p>
        <div><button type="button" class="btn primary" data-act="tick" data-m="${m.id}" data-i="${ni}" ${canTick(m.id, ni) ? "" : "disabled"}>${m.steps[ni].k === "check" ? "Yes, I can do this" : "Mark done"}</button></div></div>`
      : `<div class="card pad"><p style="font-weight:600">Module complete.</p><p class="muted">Pick the next module from the syllabus.</p></div>`;
  } else if (S.cTab === "steps") body = stepList(m.id, { videos: false });
  else body = `<div class="card pad stack gap12"><p class="muted">${m.goal}</p>${status(m.id) === "locked" ? `<p class="locked-note">${lockedReason(m.id)}</p>` : ""}<div class="card pad" style="background:var(--surface-2)"><h3 style="font-size:15px;margin-bottom:8px">How this works</h3>${howItWorks}</div></div>`;
  return top + `<div class="c-shell">${syl}<main class="c-main">
    <div class="stack gap8"><div class="row" style="flex-wrap:wrap;gap:8px"><span class="pill">Module ${m.id}</span><span class="pill">${m.phase}</span>${statusPill(m.id)}</div>
      <h1 style="font-size:26px;line-height:1.25">${m.title}</h1>
      <div class="row"><div class="bar grow" style="max-width:420px"><span style="width:${modPct(m.id)}%"></span></div><span class="mono faint">${modDoneCount(m.id)}/${m.steps.length} steps</span></div></div>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button type="button" role="tab" aria-selected="${S.cTab === k}" data-act="ctab" data-k="${k}">${l}</button>`).join("")}</div>
    ${body}${navNextPrev(m.id)}</main></div>`;
}

function navNextPrev(m) {
  const prev = MODULES[m - 1], next = MODULES[m + 1];
  return `<div class="row" style="justify-content:space-between;border-top:1px solid var(--border);padding-top:16px;margin-top:8px">
    ${prev ? `<button type="button" class="btn small" data-act="open" data-m="${prev.id}">← Module ${prev.id}</button>` : "<span></span>"}
    ${next ? `<button type="button" class="btn small" data-act="open" data-m="${next.id}">Module ${next.id}: ${next.title} →</button>` : "<span></span>"}</div>`;
}

// ───────────────── Accent swatches (light-mode accent shown as the dot) ─────────────────
const ACCENTS = [["navy","Navy","#1e3a8a"],["midnight","Midnight","#172554"],["sapphire","Sapphire","#1d4ed8"],["ocean","Ocean","#1d5fd1"],["indigo","Indigo","#4338ca"],["plum","Plum","#7c3aad"],["teal","Teal","#0f766e"],["green","Green","#0f7a55"],["rose","Rose","#be185d"],["terracotta","Terracotta","#b0502a"],["amber","Amber","#92400e"],["graphite","Graphite","#1f2937"]];
document.getElementById("accentSeg").innerHTML = ACCENTS.map(([k, l, c]) => `<button type="button" data-a="${k}"><i style="background:${c}"></i>${l}</button>`).join("");

// ───────────────── Render + events ─────────────────
function render() {
  document.documentElement.dataset.theme = S.theme;
  document.documentElement.dataset.accent = S.accent;
  document.querySelectorAll("#accentSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.a === S.accent));
  document.querySelectorAll("#variantSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === S.v));
  document.querySelectorAll("#themeSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === S.theme));
  document.getElementById("app").innerHTML = { A: renderA, B: renderB, C: renderC }[S.v]();
  save();
}
document.addEventListener("click", e => {
  const vb = e.target.closest("#variantSeg button"); if (vb) { S.v = vb.dataset.v; render(); return; }
  const ab = e.target.closest("#accentSeg button"); if (ab) { S.accent = ab.dataset.a; render(); return; }
  const tb = e.target.closest("#themeSeg button"); if (tb) { S.theme = tb.dataset.t; render(); return; }
  if (e.target.closest("#resetBtn")) { S.p = demoState(); S.view = "overview"; render(); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, m = +el.dataset.m, i = +el.dataset.i;
  if (a === "home") { S.view = "overview"; }
  else if (a === "open") { S.view = "module"; S.mod = m; S.cTab = "lesson"; window.scrollTo(0, 0); }
  else if (a === "tab") { S.tab = el.dataset.k; }
  else if (a === "ctab") { S.cTab = el.dataset.k; }
  else if (a === "tick") { if (!canTick(m, i) && !stepDone(m, i)) return; const k = m+"-"+i; S.p.done[k] = !S.p.done[k]; }
  else if (a === "watch") { const k = m+"-"+i, s = MODULES[m].steps[i]; S.p.watched[k] = Math.min(s.min, (S.p.watched[k] || 0) + Math.ceil(s.min / 3)); if (S.p.watched[k] >= s.min * 0.9) S.p.done[k] = true; }
  render();
});
render();
</script>
</body>
</html>
